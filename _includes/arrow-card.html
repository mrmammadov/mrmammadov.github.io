{%- comment -%} Usage: include arrow-card.html href=... title=... description=... {%- endcomment -%}
<a href="{{ include.href }}" class="arrow-card">
  <div class="arrow-card-body">
    <div class="font-semibold">{{ include.title }}</div>
    <div class="text-sm">{{ include.description }}</div>
  </div>
  <svg viewBox="0 0 24 24" class="arrow arrow-right" aria-hidden="true">
    <line x1="5" y1="12" x2="19" y2="12" class="arrow-line"></line>
    <polyline points="12 5 19 12 12 19" class="arrow-head"></polyline>
  </svg>
</a>
