<footer class="animate">
  <div class="container">
    <div class="back-to-top-wrap">
      <button id="back-to-top" class="btn btn-icon-left" type="button">
        <svg viewBox="0 0 24 24" class="arrow arrow-left arrow-up" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12" class="arrow-line"></line>
          <polyline points="12 5 5 12 12 19" class="arrow-head"></polyline>
        </svg>
        <span class="text-sm">Back to top</span>
      </button>
    </div>
    <div class="footer-row">
      <div>&copy; {{ 'now' | date: '%Y' }} | {{ site.title }}</div>
      <div class="theme-buttons">
        <button id="light-theme-button" class="theme-btn" type="button" aria-label="Light theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button id="dark-theme-button" class="theme-btn" type="button" aria-label="Dark theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="system-theme-button" class="theme-btn" type="button" aria-label="System theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </button>
      </div>
    </div>
  </div>
</footer>
