<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#EDE7D9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1915" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    var dark = t === "dark" || ((t === null || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.add(dark ? "dark" : "light");
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">

<noscript><style>.animate{opacity:1;transform:none}</style></noscript>
